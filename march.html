<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Controle de Gastos dos veículos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #f8f9fa;
      padding: 20px;
    }
    .form-section {
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
  </style>
</head>

<body>

<div class="container-fluid">

  <div class="form-section">
    <h2 class="text-center mb-3">Controle de Gastos e Manutenção</h2>

    <form id="gastosForm">
      <div class="row g-3">

        <div class="col-md-4">
          <label class="form-label">Data</label>
          <input type="date" id="data" class="form-control" required>
        </div>

        <div class="col-md-4">
          <label class="form-label">Quilometragem</label>
          <input type="text" id="km" class="form-control" required>
        </div>

        <div class="col-md-4">
          <label class="form-label">Qual veículo</label>
          <select id="tipo" class="form-control" required>
            <option value="">Selecione...</option>
            <option>Van Escolar BRANCA</option>
            <option>Van Escolar CINZA</option>
            <option>MOTORHOME</option>
            <option>Peugeot 208</option>
            <option>Honda HRV</option>
          </select>
        </div>

        <div class="col-md-4">
          <label class="form-label">Descrição</label>
          <input type="text" id="descricao" class="form-control" required>
        </div>

        <div class="col-md-4">
          <label class="form-label">Valor (R$)</label>
          <input type="number" id="valor" class="form-control" step="0.01" required>
        </div>

        <div class="col-md-4">
          <label class="form-label">Link da Nota Fiscal</label>
          <input type="url" id="notaFiscal" class="form-control">
        </div>

        <div class="col-md-4 d-flex align-items-end">
          <button class="btn btn-success w-100">Salvar</button>
        </div>

      </div>
    </form>
  </div>

  <!-- FILTRO -->
  <div class="mb-3">
    <label class="form-label">Filtrar por veículo</label>
    <select id="filtroVeiculo" class="form-control">
      <option value="">Todos</option>
      <option>Van Escolar BRANCA</option>
      <option>Van Escolar CINZA</option>
      <option>MOTORHOME</option>
      <option>Peugeot 208</option>
      <option>Honda HRV</option>
    </select>
  </div>

  <div class="table-responsive">
    <table class="table table-bordered table-striped">
      <thead class="table-dark">
        <tr>
          <th>Data</th>
          <th>Km</th>
          <th>Veículo</th>
          <th>Descrição</th>
          <th>Nota Fiscal</th>
          <th>Valor</th>
         
        </tr>
      </thead>
      <tbody id="tabelaBody"></tbody>
      <tfoot>
        <tr>
          <td colspan="4" class="text-end">Total:</td>
          <td colspan="2" id="totalGastos">0,00</td>
        </tr>
      </tfoot>
    </table>
  </div>

</div>

<script>
  const tableID = 624801;
  const token = "zaa0Pfbm4SCbaivRvMmlSEWGKdtldXNd";
  let todosRegistros = [];

  document.getElementById("gastosForm").addEventListener("submit", e => {
    e.preventDefault();

    fetch(`https://api.baserow.io/api/database/rows/table/${tableID}/?user_field_names=true`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Token ${token}`
      },
      body: JSON.stringify({
        "Data": data.value,
        "quilometragem": km.value,
        "Tipo": tipo.value,
        "Descrição": descricao.value,
         "Nota Fiscal (Link)": notaFiscal.value,
        "Valor (R$)": parseFloat(valor.value)
       
      })
    }).then(() => {
      gastosForm.reset();
      carregarHistorico();
    });
  });

  function carregarHistorico() {
    fetch(`https://api.baserow.io/api/database/rows/table/${tableID}/?user_field_names=true`, {
      headers: { "Authorization": `Token ${token}` }
    })
    .then(res => res.json())
    .then(data => {
      todosRegistros = data.results.sort(
        (a, b) => new Date(b.Data) - new Date(a.Data)
      );
      renderizarTabela(todosRegistros);
    });
  }

  function renderizarTabela(registros) {
    const tbody = document.getElementById("tabelaBody");
    tbody.innerHTML = "";
    let total = 0;

    registros.forEach(r => {
      const valor = parseFloat(r["Valor (R$)"]);
      if (!isNaN(valor)) total += valor;

      tbody.innerHTML += `
        <tr>
          <td>${r.Data}</td>
          <td>${r.quilometragem}</td>
          <td>${r.Tipo}</td>
          <td>${r.Descrição}</td>
          <td>${r["Nota Fiscal (Link)"] ? `<a href="${r["Nota Fiscal (Link)"]}" target="_blank">Abrir</a>` : "-"}</td>
          <td>${valor.toFixed(2)}</td>
          
        </tr>
      `;
    });

    document.getElementById("totalGastos").innerText = total.toFixed(2);
  }

  document.getElementById("filtroVeiculo").addEventListener("change", function () {
    const veiculo = this.value;
    const filtrados = veiculo
      ? todosRegistros.filter(r => r.Tipo === veiculo)
      : todosRegistros;
    renderizarTabela(filtrados);
  });

  window.onload = carregarHistorico;
</script>

</body>
</html>
